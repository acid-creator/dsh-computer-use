- insert:
    - id: computer-use-cua-driver
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cua-driver-mcp
        transport: stdio
        command: cua-driver
        args: ['mcp']
        failOnStartupError: true
    - id: computer-use-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args: ['-y', '@playwright/mcp@latest']
        failOnStartupError: true
